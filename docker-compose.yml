name: velora_store
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-password}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 20
  redis:
    image: redis:7-alpine
  web:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    volumes:
      - .:/app
      - media_data:/app/media
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    command: sh -c "python manage.py makemigrations accounts catalog orders payments reviews audit --noinput && python manage.py migrate --noinput && python manage.py seed_categories && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/',timeout=5)"]
      interval: 10s
      retries: 15
      start_period: 60s
  worker:
    build: .
    env_file: .env
    volumes: [.:/app]
    command: celery -A config worker -l info
    depends_on:
      web: {condition: service_healthy}
      redis: {condition: service_started}
  beat:
    build: .
    env_file: .env
    volumes: [.:/app]
    command: celery -A config beat -l info
    depends_on:
      web: {condition: service_healthy}
      redis: {condition: service_started}
volumes:
  postgres_data:
  media_data:
