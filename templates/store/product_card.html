<a class="product-card" href="/product/{{ p.slug }}/"><div class="product-image">{% with img=p.images.first %}{% if img %}<img src="{{ img.image.url }}" alt="{{ img.alt|default:p.name }}">{% else %}<div class="placeholder">{{ p.name|slice:':1' }}</div>{% endif %}{% endwith %}</div><small>{{ p.category.name }}</small><h3>{{ p.name }}</h3><p class="price">{% with v=p.variants.first %}{% if v %}₹{{ v.price }}{% else %}Coming soon{% endif %}{% endwith %}</p></a>
