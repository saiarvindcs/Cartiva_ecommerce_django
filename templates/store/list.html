{% extends 'store/base.html' %}{% block content %}
<div class="section-head"><div><p class="eyebrow">THE COLLECTION</p><h1>Shop products</h1></div><span>Discover your next favorite</span></div>
<form method="get" class="shop-controls"><label>Category <select name="category"><option value="">All categories</option>{% for c in categories %}<option value="{{ c.slug }}" {% if selected_category == c.slug %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></label><label>Sort by <select name="sort"><option value="newest" {% if sort == 'newest' %}selected{% endif %}>Newest</option><option value="price_asc" {% if sort == 'price_asc' %}selected{% endif %}>Price: low to high</option><option value="price_desc" {% if sort == 'price_desc' %}selected{% endif %}>Price: high to low</option><option value="name" {% if sort == 'name' %}selected{% endif %}>Name A–Z</option></select></label><input type="hidden" name="q" value="{{ query }}"><button class="btn">Apply</button></form>
<div class="products">{% for p in products %}{% include 'store/product_card.html' %}{% empty %}<p>No matching products.</p>{% endfor %}</div>{% endblock %}
