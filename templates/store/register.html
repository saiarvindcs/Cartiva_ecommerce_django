{% extends 'store/base.html' %}{% block content %}<h1>Create customer account</h1><div class="panel narrow"><form id="register"><label>Username<input id="username" required autocomplete="username"></label><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required minlength="8" autocomplete="new-password"></label><button class="btn">Register</button></form><p id="notice" role="status"></p><p>Want to sell? Register first, then choose <strong>Become a seller</strong> after signing in.</p></div>{% endblock %}{% block scripts %}<script>
document.getElementById('register').onsubmit=async e=>{e.preventDefault();const notice=document.getElementById('notice');try{await api('/api/accounts/register/',{method:'POST',body:JSON.stringify({username:document.getElementById('username').value,email:document.getElementById('email').value,password:document.getElementById('password').value})});location.href='/login/'}catch(err){notice.textContent=err.message}}
</script>{% endblock %}
