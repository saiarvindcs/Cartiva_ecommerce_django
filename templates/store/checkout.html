{% extends 'store/base.html' %}{% block content %}<h1>Secure checkout</h1><div class="panel narrow">
<h3>Your order</h3><div id="summary">Loading cart...</div>
<h3>Delivery address</h3><label>Saved address<select id="address"><option value="">Choose address</option></select></label>
<details><summary>Add new address</summary><form id="new-address"><label>Full name<input name="full_name" required></label><label>Address line 1<input name="line1" required></label><label>Address line 2<input name="line2"></label><label>City<input name="city" required></label><label>State / region<input name="region" required></label><label>Postal code<input name="postal_code" required></label><label>Phone<input name="phone" required></label><button class="btn">Save address</button></form></details>
<label>Coupon (optional)<input id="coupon"></label><button class="btn" id="place" onclick="placeOrder()">Place order</button>
<div id="result" role="status"></div><div id="payment-actions" hidden><h3>Local payment simulator</h3><p>Available only in explicitly enabled local development. No real charge.</p><button class="btn" onclick="simulate('success')">Simulate successful payment</button> <button class="btn secondary" onclick="simulate('failure')">Simulate failed payment</button></div>
</div>{% endblock %}{% block scripts %}<script>
let checkoutKey=crypto.randomUUID(),paymentId=null,currentOrderId=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const result=document.getElementById('result');
async function addresses(){try{const r=await api('/api/accounts/addresses/');const a=r.results||r;document.getElementById('address').innerHTML='<option value="">Choose address</option>'+a.map(x=>`<option value="${x.id}">${esc(x.full_name)} — ${esc(x.city)}, ${esc(x.postal_code)}</option>`).join('')}catch(e){result.textContent=e.message}}
async function cartSummary(){try{const r=await api('/api/orders/cart/');const a=r.results||r;document.getElementById('summary').textContent=a.map(x=>`${x.product_name} × ${x.quantity}: ₹${x.subtotal}`).join(' | ')+' · Total ₹'+a.reduce((n,x)=>n+Number(x.subtotal),0).toFixed(2)}catch(e){result.textContent=e.message}}
document.getElementById('new-address').onsubmit=async e=>{e.preventDefault();try{const data=Object.fromEntries(new FormData(e.target));const a=await api('/api/accounts/addresses/',{method:'POST',body:JSON.stringify(data)});await addresses();document.getElementById('address').value=a.id;result.textContent='Address saved'}catch(err){result.textContent=err.message}};
async function placeOrder(){const address_id=Number(document.getElementById('address').value);if(!address_id){result.textContent='Select or save an address';return}const btn=document.getElementById('place');btn.disabled=true;try{const order=await api('/api/orders/checkout/',{method:'POST',headers:{'Idempotency-Key':checkoutKey},body:JSON.stringify({address_id,coupon_code:document.getElementById('coupon').value})});currentOrderId=order.id;result.textContent=`Order #${order.id} created. Status: ${order.status}. Total ₹${order.total}. Payment pending.`;try{const p=await api('/api/payments/intent/',{method:'POST',body:JSON.stringify({order_id:order.id})});paymentId=p.payment_id;document.getElementById('payment-actions').hidden=false}catch(err){result.textContent+=' Mock payment unavailable: '+err.message}}catch(err){result.textContent=err.message;btn.disabled=false}}
async function simulate(outcome){if(!paymentId)return;try{const r=await api('/api/payments/mock/simulate/',{method:'POST',body:JSON.stringify({payment_id:paymentId,outcome})});result.textContent=`Payment ${r.status}. Order status: ${r.order_status}`;document.getElementById('payment-actions').hidden=true;if(r.status==='succeeded'){location.assign('/order-confirmation/'+currentOrderId+'/')}else{result.textContent+=' — You can view or cancel this order in My Orders.'}}catch(err){result.textContent=err.message}}
addresses();cartSummary();
</script>{% endblock %}
