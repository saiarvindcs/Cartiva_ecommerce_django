{% extends 'store/base.html' %}{% block content %}<h1>Sign in</h1><div class="panel narrow"><form id="login"><label>Username<input id="username" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button class="btn">Sign in</button></form><p id="notice" role="status"></p><p>New here? <a href="/register/">Register</a></p></div>{% endblock %}{% block scripts %}<script>
document.getElementById('login').onsubmit=async e=>{e.preventDefault();try{await loginDemo(document.getElementById('username').value,document.getElementById('password').value);const next=new URLSearchParams(location.search).get('next');location.href=next&&next.startsWith('/')&&!next.startsWith('//')?next:'/'}catch(err){document.getElementById('notice').textContent=err.message}}
</script>{% endblock %}
