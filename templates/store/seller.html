{% extends 'store/base.html' %}{% block content %}
<h1>Seller dashboard</h1><div class="panel"><p id="seller-state">Checking your account...</p><button id="become-seller" class="btn" hidden>Become a seller</button></div>
<section id="seller-tools" hidden><div class="panel"><h2>Sales overview</h2><div id="seller-stats">Loading seller metrics…</div></div><div class="panel"><h2>Add product</h2><form id="product-form"><label>Product name<input id="product-name" required maxlength="180"></label><label>Category<select id="category" required></select></label><label>Description<textarea id="description"></textarea></label><button class="btn">Create product</button></form><p id="product-result" role="status"></p></div>
<div class="panel"><h2>Add variant and stock</h2><form id="variant-form"><label>Product<select id="variant-product" required></select></label><label>SKU<input id="sku" required></label><label>Size<input id="size"></label><label>Color<input id="color"></label><label>Price (INR)<input id="price" type="number" min="0.01" step="0.01" required></label><label>Stock<input id="stock" type="number" min="0" required></label><button class="btn">Add variant</button></form><p id="variant-result" role="status"></p></div>
<div class="panel"><h2>Upload product image</h2><form id="image-form"><label>Product<select id="image-product" required></select></label><label>Image<input id="image" type="file" accept="image/*" required></label><label>Alt text<input id="image-alt"></label><button class="btn">Upload image</button></form><p id="image-result" role="status"></p></div>
<div class="panel" id="edit-panel" hidden><h2>Edit product</h2><form id="edit-form"><input id="edit-id" type="hidden"><label>Product name<input id="edit-name" required maxlength="180"></label><label>Category<select id="edit-category" required></select></label><label>Description<textarea id="edit-description"></textarea></label><label><input type="checkbox" id="edit-active"> Active</label><button class="btn">Save product</button><button type="button" class="btn secondary" onclick="document.getElementById('edit-panel').hidden=true">Cancel</button></form><p id="edit-result" role="status"></p><h3>Variants</h3><div id="edit-variants"></div><h3>Images</h3><div id="edit-images"></div></div><div class="panel"><h2>My products</h2><div id="my-products"></div></div></section>
{% endblock %}{% block scripts %}<script>
let sellerProducts=[];
const $=id=>document.getElementById(id);
function slugify(s){return s.toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,45)+'-'+Date.now().toString(36)}
async function loadSellerProducts(){const r=await api('/api/catalog/products/?page_size=100');const all=r.results||r;sellerProducts=all.filter(p=>p.seller===Number(window.sellerId));const opts=sellerProducts.map(p=>`<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('');$('variant-product').innerHTML=opts;$('image-product').innerHTML=opts;$('my-products').innerHTML=sellerProducts.map(p=>`<div class="cart-row"><span>${escapeHtml(p.name)} · ${escapeHtml(p.slug)}</span><span>${p.variants.map(v=>escapeHtml(v.sku)+' ₹'+escapeHtml(v.price)+' (stock '+v.stock+')').join(', ')||'No variants yet'}</span><a href="/product/${encodeURIComponent(p.slug)}/">View</a><button type="button" onclick="editProduct(${p.id})">Edit</button><button type="button" onclick="deleteProduct(${p.id})">Delete</button></div>`).join('')||'No products yet';}
async function deleteProduct(id){if(!confirm('Delete this product and its variants?'))return;try{await api('/api/catalog/products/'+id+'/',{method:'DELETE'});await loadSellerProducts();try{const d=await api('/api/analytics/seller/');$('seller-stats').textContent=`Revenue ₹${d.revenue} · ${d.orders} orders · ${d.units_sold} units sold · ${d.products} products`}catch(err){$('seller-stats').textContent=err.message}}catch(e){alert(e.message)}}
async function initSeller(){try{const me=await api('/api/accounts/me/');window.sellerId=me.id;if(me.role==='customer'){$('seller-state').textContent='You are a customer. You can request seller access.';$('become-seller').hidden=false;return}if(me.role!=='seller'&&me.role!=='admin')throw Error('Seller access required');$('seller-state').textContent='Signed in as '+me.username+' (seller)';$('seller-tools').hidden=false;const c=await api('/api/catalog/categories/');$('category').innerHTML=(c.results||c).map(x=>`<option value="${x.id}">${escapeHtml(x.name)}</option>`).join('');$('edit-category').innerHTML=$('category').innerHTML;await loadSellerProducts();try{const d=await api('/api/analytics/seller/');$('seller-stats').textContent=`Revenue ₹${d.revenue} · ${d.orders} orders · ${d.units_sold} units sold · ${d.products} products`}catch(err){$('seller-stats').textContent=err.message}}catch(e){$('seller-state').textContent='Please sign in to manage your store. '+e.message}}
$('become-seller').onclick=async()=>{try{await api('/api/accounts/become-seller/',{method:'POST'});location.reload()}catch(e){$('seller-state').textContent=e.message}};
$('product-form').onsubmit=async e=>{e.preventDefault();try{const name=$('product-name').value;const r=await api('/api/catalog/products/',{method:'POST',body:JSON.stringify({name,slug:slugify(name),category:Number($('category').value),description:$('description').value,active:true})});$('product-result').textContent='Product #'+r.id+' created. Now add a variant.';await loadSellerProducts()}catch(err){$('product-result').textContent=err.message}};
$('variant-form').onsubmit=async e=>{e.preventDefault();try{const r=await api('/api/catalog/variants/',{method:'POST',body:JSON.stringify({product:Number($('variant-product').value),sku:$('sku').value,size:$('size').value,color:$('color').value,price:$('price').value,stock:Number($('stock').value),active:true})});$('variant-result').textContent='Variant #'+r.id+' created';await loadSellerProducts()}catch(err){$('variant-result').textContent=err.message}};
$('image-form').onsubmit=async e=>{e.preventDefault();try{const data=new FormData();data.append('product',$('image-product').value);data.append('image',$('image').files[0]);data.append('alt',$('image-alt').value);const r=await api('/api/catalog/images/',{method:'POST',body:data});$('image-result').textContent='Image #'+r.id+' uploaded';await loadSellerProducts()}catch(err){$('image-result').textContent=err.message}};
function editProduct(id){const p=sellerProducts.find(x=>x.id===id);if(!p)return;$('edit-panel').hidden=false;$('edit-id').value=id;$('edit-name').value=p.name;$('edit-category').value=p.category;$('edit-description').value=p.description;$('edit-active').checked=p.active;renderEditParts(p);$('edit-panel').scrollIntoView({behavior:'smooth'});}
function renderEditParts(p){$('edit-variants').innerHTML=p.variants.map(v=>`<form class="variant-edit" onsubmit="saveVariant(event,${v.id})"><strong>${escapeHtml(v.sku)}</strong><label>Price<input name="price" type="number" step="0.01" min="0.01" value="${escapeHtml(v.price)}" required></label><label>Stock<input name="stock" type="number" min="${v.reserved}" value="${v.stock}" required></label><button class="btn secondary">Update variant</button></form>`).join('')||'No variants yet';$('edit-images').innerHTML=p.images.map(img=>`<div class="cart-row"><img src="${escapeHtml(img.image)}" width="75" alt="${escapeHtml(img.alt)}"><span>${escapeHtml(img.alt||'Product image')}</span><button type="button" onclick="removeImage(${img.id})">Remove image</button></div>`).join('')||'No images yet';}
$('edit-form').onsubmit=async e=>{e.preventDefault();try{await api('/api/catalog/products/'+$('edit-id').value+'/',{method:'PATCH',body:JSON.stringify({name:$('edit-name').value,category:Number($('edit-category').value),description:$('edit-description').value,active:$('edit-active').checked})});$('edit-result').textContent='Product saved';await loadSellerProducts();editProduct(Number($('edit-id').value))}catch(err){$('edit-result').textContent=err.message}};
async function saveVariant(e,id){e.preventDefault();const f=new FormData(e.target);try{await api('/api/catalog/variants/'+id+'/',{method:'PATCH',body:JSON.stringify({price:f.get('price'),stock:Number(f.get('stock'))})});await loadSellerProducts();editProduct(Number($('edit-id').value))}catch(err){alert(err.message)}}
async function removeImage(id){if(!confirm('Remove this product image?'))return;try{await api('/api/catalog/images/'+id+'/',{method:'DELETE'});await loadSellerProducts();editProduct(Number($('edit-id').value))}catch(err){alert(err.message)}}
initSeller();
</script>{% endblock %}
