{% extends 'store/base.html' %}{% block content %}<p class="eyebrow">YOUR PURCHASES</p><h1>My orders</h1><div id="orders">Loading...</div>{% endblock %}{% block scripts %}<script>
const out=document.getElementById('orders');
async function loadOrders(){try{const r=await api('/api/orders/orders/');const items=r.results||r;out.innerHTML=items.map(o=>`<article class="panel order-card"><div class="order-head"><h2>Order #${o.id}</h2><span class="status-pill">${escapeHtml(o.status)}</span></div><p class="muted">Placed ${new Date(o.created_at).toLocaleDateString()} · ₹${escapeHtml(o.total)}</p>${o.items.map(i=>`<div class="order-line"><strong>${escapeHtml(i.product_name)}</strong><span>${escapeHtml(i.sku)} · Qty ${i.quantity} · ₹${escapeHtml(i.unit_price)}</span></div>`).join('')}<details><summary>Delivery and order details</summary><p>${escapeHtml(o.address_snapshot?.full_name||'')} · ${escapeHtml(o.address_snapshot?.line1||'')} · ${escapeHtml(o.address_snapshot?.city||'')} · ${escapeHtml(o.address_snapshot?.postal_code||'')}</p><p>Subtotal ₹${escapeHtml(o.subtotal)} · Discount ₹${escapeHtml(o.discount)} · Total ₹${escapeHtml(o.total)}</p></details>${o.status==='pending'?`<button class="btn secondary" onclick="cancelOrder(${o.id})">Cancel pending order</button>`:''}</article>`).join('')||'<div class="panel">No orders yet.</div>'}catch(e){out.textContent=e.message}}
async function cancelOrder(id){if(!confirm('Cancel Order #'+id+'?'))return;try{await api('/api/orders/orders/'+id+'/cancel/',{method:'POST',body:JSON.stringify({})});await loadOrders()}catch(e){alert(e.message)}}loadOrders();
</script>{% endblock %}
