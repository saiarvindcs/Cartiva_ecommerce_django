{% extends 'store/base.html' %}{% block content %}<div class="panel confirmation"><p class="eyebrow">ORDER CONFIRMED</p><h1>Thank you for shopping with Cartiva.</h1><p>Your payment was successful. Your order is being prepared.</p><h2>Order #{{ order_id }}</h2><div id="confirmation-details">Loading order details…</div><div class="actions"><a class="btn" href="/my-orders/">View my orders</a><a class="btn secondary" href="/shop/">Continue shopping</a></div></div>{% endblock %}{% block scripts %}<script>api('/api/orders/orders/{{ order_id }}/').then(o=>{document.getElementById('confirmation-details').textContent=o.items.map(i=>i.product_name+' × '+i.quantity).join(', ')+' · Total ₹'+o.total+' · Status: '+o.status}).catch(e=>document.getElementById('confirmation-details').textContent=e.message)</script>{% endblock %}
