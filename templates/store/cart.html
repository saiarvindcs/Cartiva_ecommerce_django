{% extends 'store/base.html' %}{% block content %}<h1>Your shopping cart</h1><div class="panel"><div id="cart-items">Loading...</div><h3 id="total"></h3><a class="btn" href="/checkout/">Proceed to checkout</a></div>{% endblock %}{% block scripts %}<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function loadCart(){try{const r=await api('/api/orders/cart/');const items=r.results||r;document.getElementById('cart-items').innerHTML=items.length?items.map(i=>`<div class="cart-row"><span>${i.image_url?`<img src="${esc(i.image_url)}" width="64" alt="">`:''} ${esc(i.product_name)} · ${esc(i.sku)} (${esc(i.size)} ${esc(i.color)})</span><span>₹${esc(i.unit_price)}</span><button onclick="changeQty(${i.id},${i.quantity-1})">−</button><span>${i.quantity}</span><button onclick="changeQty(${i.id},${i.quantity+1})">+</button><strong>₹${esc(i.subtotal)}</strong><button onclick="removeItem(${i.id})">Remove</button></div>`).join(''):'Your cart is empty.';document.getElementById('total').textContent='Total: ₹'+items.reduce((a,i)=>a+Number(i.subtotal),0).toFixed(2)}catch(e){document.getElementById('cart-items').textContent=e.message}}
async function removeItem(id){try{await api('/api/orders/cart/'+id+'/',{method:'DELETE'});loadCart()}catch(e){alert(e.message)}}
async function changeQty(id,q){if(q<1)return removeItem(id);try{await api('/api/orders/cart/'+id+'/',{method:'PATCH',body:JSON.stringify({quantity:q})});loadCart()}catch(e){alert(e.message)}}loadCart();
</script>{% endblock %}
