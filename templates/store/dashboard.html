{% extends 'store/base.html' %}{% block content %}<h1>Admin analytics</h1><p>Staff access required. Use the token login below or Swagger to authenticate.</p><div class="stats" id="stats"><div class="panel">Loading metrics...</div></div>{% endblock %}{% block scripts %}<script>api('/api/analytics/dashboard/').then(d=>{document.getElementById('stats').innerHTML=`<div class="panel"><h3>Sales days</h3><strong>${d.daily_sales.length}</strong></div><div class="panel"><h3>Top products</h3><strong>${d.top_products.length}</strong></div><div class="panel"><h3>Low stock SKUs</h3><strong>${d.low_stock.length}</strong></div>`}).catch(e=>document.getElementById('stats').textContent=e.message)</script>{% endblock %}
